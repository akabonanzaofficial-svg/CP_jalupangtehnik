<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMS Artikel | Jalupang Teknik</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        body { background: #f0fdf4; }
        .glass { background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); }
        .btn-primary { background: #16a34a; color: white; padding: 8px 20px; border-radius: 8px; transition: all 0.2s; }
        .btn-primary:hover { background: #15803d; transform: translateY(-1px); }
        .btn-danger { background: #dc2626; color: white; padding: 8px 20px; border-radius: 8px; transition: all 0.2s; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-secondary { background: #6b7280; color: white; padding: 8px 20px; border-radius: 8px; transition: all 0.2s; }
        .btn-secondary:hover { background: #4b5563; }
        .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; }
        .status-published { background: #dcfce7; color: #166534; padding: 2px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-draft { background: #fef3c7; color: #92400e; padding: 2px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .preview-text { max-height: 100px; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

<!-- ========== NAVIGASI ========== -->
<nav class="fixed w-full z-50 glass border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
                <div class="w-8 h-8 rounded-lg bg-green-600 flex items-center justify-center text-white">
                    <i class="fas fa-leaf"></i>
                </div>
                <span class="font-bold text-xl text-gray-800">CMS <span class="text-green-600">Jalupang</span></span>
            </div>
            <div class="flex items-center gap-4">
                <a href="blog.html" target="_blank" class="text-sm text-gray-500 hover:text-green-600 transition-colors">
                    <i class="fas fa-external-link-alt mr-1"></i> Lihat Website
                </a>
                <button onclick="loadArticles()" class="text-sm bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition-colors">
                    <i class="fas fa-sync mr-1"></i> Refresh
                </button>
            </div>
        </div>
    </div>
</nav>

<!-- ========== MAIN CONTENT ========== -->
<div class="pt-24 pb-12 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- Tombol Tambah Artikel -->
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">📝 Kelola Artikel</h1>
        <button onclick="showForm()" class="btn-primary flex items-center gap-2">
            <i class="fas fa-plus"></i> Artikel Baru
        </button>
    </div>

    <!-- Form Artikel -->
    <div id="articleForm" class="card mb-6 hidden">
        <h2 id="formTitle" class="text-xl font-bold text-gray-800 mb-4">Tambah Artikel Baru</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Judul *</label>
                <input id="inputTitle" type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none" placeholder="Judul Artikel">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Kategori</label>
                <select id="inputCategory" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none">
                    <option value="teknologi">Teknologi</option>
                    <option value="lingkungan">Lingkungan</option>
                    <option value="energi">Energi</option>
                    <option value="limbah">Limbah</option>
                    <option value="berita">Berita</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Author</label>
                <input id="inputAuthor" type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none" placeholder="Nama Penulis">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Read Time (menit)</label>
                <input id="inputReadTime" type="number" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none" placeholder="5" value="5">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                <select id="inputStatus" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none">
                    <option value="published">Published</option>
                    <option value="draft">Draft</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Featured</label>
                <select id="inputFeatured" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none">
                    <option value="TRUE">Ya</option>
                    <option value="FALSE">Tidak</option>
                </select>
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Excerpt (Ringkasan)</label>
                <input id="inputExcerpt" type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none" placeholder="Ringkasan singkat artikel...">
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Gambar (URL)</label>
                <input id="inputImage" type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none" placeholder="https://images.unsplash.com/...">
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Konten (HTML) *</label>
                <textarea id="inputContent" rows="12" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none font-mono text-sm" placeholder="<h2>Judul</h2><p>Isi artikel...</p>"></textarea>
            </div>
        </div>
        
        <div class="flex gap-3 mt-6">
            <button onclick="saveArticle()" class="btn-primary flex items-center gap-2">
                <i class="fas fa-save"></i> Simpan Artikel
            </button>
            <button onclick="hideForm()" class="btn-secondary flex items-center gap-2">
                <i class="fas fa-times"></i> Batal
            </button>
        </div>
        <div id="formMessage" class="mt-4 hidden"></div>
    </div>

    <!-- Daftar Artikel -->
    <div class="card">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-semibold text-gray-800">Daftar Artikel</h2>
            <span id="articleCount" class="text-sm text-gray-500">0 artikel</span>
        </div>
        
        <div id="articleList" class="space-y-3">
            <!-- Akan diisi JavaScript -->
            <div class="text-center py-8 text-gray-400">
                <i class="fas fa-spinner fa-spin text-2xl"></i>
                <p class="mt-2">Memuat artikel...</p>
            </div>
        </div>
    </div>
</div>

<!-- ========== SCRIPTS ========== -->
<script>
// ============================================================
// KONFIGURASI - GANTI DENGAN URL WEB APP ANDA
// ============================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbzohWKoI1nl5mf2p8u83vvYrqxuxbck4QhlZ7toI3XKYYZfipJTDb41OHj4ES9k6wSq/exec';
// Ganti YOUR_DEPLOYMENT_ID dengan ID dari hasil deploy

let editingId = null;
let articles = [];

// ============================================================
// LOAD ARTICLES
// ============================================================
async function loadArticles() {
    const list = document.getElementById('articleList');
    list.innerHTML = `
        <div class="text-center py-8 text-gray-400">
            <i class="fas fa-spinner fa-spin text-2xl"></i>
            <p class="mt-2">Memuat artikel...</p>
        </div>
    `;

    try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        if (data.error) throw new Error(data.error);
        
        articles = data;
        document.getElementById('articleCount').textContent = articles.length + ' artikel';
        renderArticles();
    } catch (error) {
        list.innerHTML = `
            <div class="text-center py-8 text-red-500">
                <i class="fas fa-exclamation-circle text-2xl"></i>
                <p class="mt-2">Gagal memuat artikel: ${error.message}</p>
                <button onclick="loadArticles()" class="mt-4 btn-primary">Coba Lagi</button>
            </div>
        `;
    }
}

// ============================================================
// RENDER ARTICLES
// ============================================================
function renderArticles() {
    const list = document.getElementById('articleList');
    
    if (articles.length === 0) {
        list.innerHTML = `
            <div class="text-center py-8 text-gray-400">
                <i class="fas fa-inbox text-4xl"></i>
                <p class="mt-2">Belum ada artikel. Klik "Artikel Baru" untuk menambahkan.</p>
            </div>
        `;
        return;
    }

    list.innerHTML = articles.map(article => `
        <div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl hover:bg-gray-100 transition-colors border border-gray-100">
            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-3">
                    <span class="text-sm font-medium text-gray-400">#${article.id || '?'}</span>
                    <h3 class="font-semibold text-gray-800 truncate">${article.title || 'Tanpa Judul'}</h3>
                    <span class="${article.status === 'published' ? 'status-published' : 'status-draft'}">${article.status || 'draft'}</span>
                    ${article.is_featured === true || article.is_featured === 'TRUE' ? '<span class="text-yellow-500 text-sm"><i class="fas fa-star"></i></span>' : ''}
                </div>
                <div class="flex items-center gap-4 text-xs text-gray-400 mt-1">
                    <span><i class="fas fa-folder mr-1"></i>${article.category || 'umum'}</span>
                    ${article.author ? `<span><i class="fas fa-user mr-1"></i>${article.author}</span>` : ''}
                    ${article.created_at ? `<span><i class="far fa-calendar mr-1"></i>${formatDate(article.created_at)}</span>` : ''}
                </div>
                <div class="text-sm text-gray-500 truncate mt-1">${article.excerpt || 'Tidak ada ringkasan'}</div>
            </div>
            <div class="flex gap-2 ml-4 flex-shrink-0">
                <button onclick="editArticle(${article.id})" class="px-3 py-1.5 bg-blue-100 text-blue-700 rounded-lg text-sm hover:bg-blue-200 transition-colors">
                    <i class="fas fa-edit"></i>
                </button>
                <button onclick="deleteArticle(${article.id})" class="px-3 py-1.5 bg-red-100 text-red-700 rounded-lg text-sm hover:bg-red-200 transition-colors">
                    <i class="fas fa-trash"></i>
                </button>
                <a href="article-detail.html?id=${article.id}" target="_blank" class="px-3 py-1.5 bg-green-100 text-green-700 rounded-lg text-sm hover:bg-green-200 transition-colors">
                    <i class="fas fa-eye"></i>
                </a>
            </div>
        </div>
    `).join('');
}

// ============================================================
// FORMAT DATE
// ============================================================
function formatDate(dateString) {
    if (!dateString) return '-';
    try {
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return '-';
        return date.toLocaleDateString('id-ID', {
            day: 'numeric',
            month: 'short',
            year: 'numeric'
        });
    } catch {
        return '-';
    }
}

// ============================================================
// SHOW FORM
// ============================================================
function showForm(data) {
    document.getElementById('articleForm').classList.remove('hidden');
    document.getElementById('articleForm').scrollIntoView({ behavior: 'smooth' });
    
    if (data) {
        editingId = data.id;
        document.getElementById('formTitle').textContent = '✏️ Edit Artikel';
        document.getElementById('inputTitle').value = data.title || '';
        document.getElementById('inputCategory').value = data.category || 'teknologi';
        document.getElementById('inputAuthor').value = data.author || '';
        document.getElementById('inputReadTime').value = data.read_time || 5;
        document.getElementById('inputStatus').value = data.status || 'draft';
        document.getElementById('inputFeatured').value = data.is_featured === true || data.is_featured === 'TRUE' ? 'TRUE' : 'FALSE';
        document.getElementById('inputExcerpt').value = data.excerpt || '';
        document.getElementById('inputImage').value = data.featured_image || '';
        document.getElementById('inputContent').value = data.content || '';
    } else {
        editingId = null;
        document.getElementById('formTitle').textContent = '📝 Tambah Artikel Baru';
        document.getElementById('inputTitle').value = '';
        document.getElementById('inputCategory').value = 'teknologi';
        document.getElementById('inputAuthor').value = '';
        document.getElementById('inputReadTime').value = 5;
        document.getElementById('inputStatus').value = 'published';
        document.getElementById('inputFeatured').value = 'FALSE';
        document.getElementById('inputExcerpt').value = '';
        document.getElementById('inputImage').value = '';
        document.getElementById('inputContent').value = '';
    }
    document.getElementById('formMessage').classList.add('hidden');
}

// ============================================================
// HIDE FORM
// ============================================================
function hideForm() {
    document.getElementById('articleForm').classList.add('hidden');
    document.getElementById('formMessage').classList.add('hidden');
}

// ============================================================
// SAVE ARTICLE
// ============================================================
async function saveArticle() {
    const title = document.getElementById('inputTitle').value.trim();
    const content = document.getElementById('inputContent').value.trim();
    
    if (!title) {
        showMessage('Judul wajib diisi!', 'error');
        return;
    }
    if (!content) {
        showMessage('Konten wajib diisi!', 'error');
        return;
    }

    const data = {
        title: title,
        category: document.getElementById('inputCategory').value,
        author: document.getElementById('inputAuthor').value.trim(),
        read_time: parseInt(document.getElementById('inputReadTime').value) || 5,
        status: document.getElementById('inputStatus').value,
        is_featured: document.getElementById('inputFeatured').value === 'TRUE' ? true : false,
        excerpt: document.getElementById('inputExcerpt').value.trim(),
        featured_image: document.getElementById('inputImage').value.trim(),
        content: content
    };

    if (editingId) {
        data.id = editingId;
    }

    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data)
        });
        
        showMessage('✅ Artikel berhasil disimpan!', 'success');
        setTimeout(() => {
            hideForm();
            loadArticles();
        }, 1500);
        
    } catch (error) {
        showMessage('❌ Gagal menyimpan: ' + error.message, 'error');
    }
}

// ============================================================
// EDIT ARTICLE
// ============================================================
function editArticle(id) {
    const article = articles.find(a => a.id === id);
    if (article) {
        showForm(article);
    }
}

// ============================================================
// DELETE ARTICLE
// ============================================================
async function deleteArticle(id) {
    if (!confirm('Apakah Anda yakin ingin menghapus artikel ini?')) return;
    
    try {
        const response = await fetch(`${API_URL}?id=${id}`, {
            method: 'DELETE',
            mode: 'no-cors'
        });
        
        showMessage('✅ Artikel berhasil dihapus!', 'success');
        setTimeout(() => loadArticles(), 1000);
        
    } catch (error) {
        showMessage('❌ Gagal menghapus: ' + error.message, 'error');
    }
}

// ============================================================
// SHOW MESSAGE
// ============================================================
function showMessage(text, type) {
    const msg = document.getElementById('formMessage');
    msg.textContent = text;
    msg.className = 'mt-4 p-3 rounded-lg ' + (type === 'error' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700');
    msg.classList.remove('hidden');
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', loadArticles);
</script>
</body>
</html>
